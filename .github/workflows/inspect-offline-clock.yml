name: Diagnosticar relogio offline na proposta
on:
  pull_request:
    branches: [main]
    paths: ['qa/inspect-offline-clock.py', '.github/workflows/inspect-offline-clock.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mostrar pontos de integração do jogo offline
        run: python3 qa/inspect-offline-clock.py
