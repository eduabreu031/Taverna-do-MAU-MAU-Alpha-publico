name: Conferir e publicar Taverna das Sombras
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alpha-publico-deploy
  cancel-in-progress: true
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v5
      - name: Preparar Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Conferir jogo e integridade das regras
        run: node qa/validar.js site
  publicar:
    needs: validar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v5
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar somente os arquivos publicos
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Colocar jogo no ar
        id: deployment
        uses: actions/deploy-pages@v4
