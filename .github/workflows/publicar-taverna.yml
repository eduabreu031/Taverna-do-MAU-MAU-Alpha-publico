name: Conferir e publicar Taverna do MAU MAU
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alpha-publico-deploy
  cancel-in-progress: true
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Preparar Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Aplicar icones oficiais do pacote
        run: |
          if [ -f Taverna_do_MAU_MAU_Icones_Oficiais.zip ]; then
            unzip -tq Taverna_do_MAU_MAU_Icones_Oficiais.zip
            unzip -oq Taverna_do_MAU_MAU_Icones_Oficiais.zip -d .
            test -s site/icons/icon-192.png
            test -s site/icons/icon-512.png
            echo "Icones oficiais aplicados."
          else
            echo "Pacote de icones ainda nao enviado; mantendo imagens atuais."
          fi
      - name: Instalar renderizador de icones v91
        run: python3 -m pip install --disable-pip-version-check cairosvg
      - name: Mesclar Beta pública mais recente ao código Alpha sem alterar o Worker
        run: python3 qa/merge-beta-frontend.py
      - name: Aplicar somente livro de regras e novo icone
        run: python3 qa/apply-alpha-ui-v91.py site
      - name: Adicionar changelog e relatos Alpha v92
        run: python3 qa/apply-alpha-v92.py site
      - name: Padronizar nome oficial no HTML
        run: python3 qa/padronizar-nome.py site
      - name: Integrar contas e login à interface multiplayer
        run: python3 qa/apply-alpha-accounts.py site
      - name: Adicionar VIP e seleção temática de bots
        run: python3 qa/apply-vip-bots-ui.py site
      - name: Conferir jogo e integridade das regras
        run: node qa/validar.js site
  publicar:
    needs: validar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Aplicar icones oficiais do pacote
        run: |
          if [ -f Taverna_do_MAU_MAU_Icones_Oficiais.zip ]; then
            unzip -tq Taverna_do_MAU_MAU_Icones_Oficiais.zip
            unzip -oq Taverna_do_MAU_MAU_Icones_Oficiais.zip -d .
            test -s site/icons/icon-192.png
            test -s site/icons/icon-512.png
            echo "Icones oficiais aplicados."
          else
            echo "Pacote de icones ainda nao enviado; mantendo imagens atuais."
          fi
      - name: Instalar renderizador de icones v91
        run: python3 -m pip install --disable-pip-version-check cairosvg
      - name: Mesclar Beta pública mais recente ao código Alpha sem alterar o Worker
        run: python3 qa/merge-beta-frontend.py
      - name: Aplicar somente livro de regras e novo icone
        run: python3 qa/apply-alpha-ui-v91.py site
      - name: Adicionar changelog e relatos Alpha v92
        run: python3 qa/apply-alpha-v92.py site
      - name: Padronizar nome oficial no HTML
        run: python3 qa/padronizar-nome.py site
      - name: Integrar contas e login à interface multiplayer
        run: python3 qa/apply-alpha-accounts.py site
      - name: Adicionar VIP e seleção temática de bots
        run: python3 qa/apply-vip-bots-ui.py site
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar somente os arquivos publicos
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Colocar jogo no ar
        id: deployment
        uses: actions/deploy-pages@v4
