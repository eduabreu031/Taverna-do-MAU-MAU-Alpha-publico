name: Importar relatos anônimos para Issues
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: importar-feedback-alpha
  cancel-in-progress: false
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Criar Issues a partir da caixa de entrada da Taverna
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');
            const code=fs.readFileSync('.github/scripts/import-feedback.js','utf8');
            const AsyncFunction=Object.getPrototypeOf(async function(){}).constructor;
            await new AsyncFunction('github','context','core',code)(github,context,core);
