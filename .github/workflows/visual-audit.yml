name: Auditoria visual de menus e responsividade
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m pip install cairosvg
      - run: python3 qa/merge-beta-frontend.py
      - run: python3 qa/apply-alpha-ui-v91.py site
      - run: python3 qa/apply-alpha-v92.py site
      - run: python3 qa/padronizar-nome.py site
      - run: python3 qa/apply-alpha-accounts.py site
      - run: python3 qa/apply-vip-bots-ui.py site
      - run: python3 qa/apply-visitor-entry.py site
      - name: Instalar navegador de teste
        run: npm install --no-save playwright@1.58.2 && npx playwright install --with-deps chromium
      - name: Executar navegador e verificar layouts
        run: |
          python3 -m http.server 8765 -d site >/tmp/taverna-http.log 2>&1 &
          # Primeiro rodar a auditoria antiga na configuração original.
          node qa/visual-audit.mjs
          # Depois montar o jogo público inteiro para auditar o novo multiplayer.
          python3 qa/apply-rematch-lobby.py site
          python3 qa/apply-online-skip-final.py site
          python3 qa/apply-social-features.py site
          python3 qa/apply-online-abandon.py site
          python3 qa/apply-seasonal-theme.py site
          python3 qa/apply-tavern-entrance.py site
          python3 qa/apply-online-resume.py site
          python3 qa/apply-cronicas-ui.py site
          python3 qa/apply-lounge-ui.py site
          python3 qa/apply-tavern-ui-shell.py site
          node qa/test-premium-browser.mjs
          node qa/test-offline-premium-browser.mjs
      - name: Guardar capturas para auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-menus-taverna
          path: |
            qa/screenshots/
            qa/screenshots-premium/
            qa/screenshots-offline-premium/
          if-no-files-found: ignore
