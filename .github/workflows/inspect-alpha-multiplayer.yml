name: Validar integração de contas na Alpha
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m pip install --disable-pip-version-check cairosvg
      - run: python3 qa/merge-beta-frontend.py
      - run: python3 qa/apply-alpha-ui-v91.py site
      - run: python3 qa/apply-alpha-v92.py site
      - run: python3 qa/padronizar-nome.py site
      - run: python3 qa/inspect-bot-vip.py
      - run: python3 qa/inspect-alpha-patch.py
      - run: python3 qa/inspect-alpha-multiplayer.py
      - name: Integrar login e salas
        run: python3 qa/apply-alpha-accounts.py site
      - name: Adicionar VIP e seleção temática de bots
        run: python3 qa/apply-vip-bots-ui.py site
      - name: Ativar visitantes sem cache e aviso de remoção
        run: python3 qa/apply-visitor-entry.py site
      - name: Validar motor e sintaxe de scripts
        run: node qa/validar.js site
