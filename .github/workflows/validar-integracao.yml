name: Validar integração multiplayer sem regressão offline
permissions:
  contents: write
on:
  push:
    branches: [integracao-multiplayer-original]
  workflow_dispatch:
jobs:
  integridade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar protocolo online
        run: node --test qa/online-adapter.test.mjs qa/online-event-bridge.test.mjs
      - name: Garantir v84 original intacta
        run: node qa/garantir-v84-original.mjs
      - name: Montar a interface DEV integrada
        run: node integracao/montar-dev.mjs
      - name: Validar scripts da interface integrada
        run: |
          node --check integracao/online-v84-controller.js
          node --check integracao/online-v84-render-bridge.js
      - name: Validar mesa online e retorno offline em Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node qa/online-ui-smoke.mjs
      - name: Montar v3 exatamente igual à versão aprovada
        run: node integracao/montar-v3-aprovada.mjs
      - name: Verificar sintaxe da release v3
        run: node qa/validar-release-v3.mjs
      - name: Montar versão v4 com encerramento e revanche
        run: node integracao/montar-v4-rematch.mjs
      - name: Testar fim de duelo, revanche e saída
        run: node qa/online-finished-rematch.test.mjs
      - name: Montar v5 e testar anúncio para convidados
        run: |
          node integracao/montar-v5-vitoria.mjs
          TAVERNA_RELEASE=../release-v5/index.html node qa/validar-release-v3.mjs
          node qa/online-vitoria-convidado.test.mjs
      - name: Testar a v3 aprovada no navegador
        run: TAVERNA_HTML=../release/index.html node qa/online-ui-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: taverna-multiplayer-v3-aprovada
          path: release/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: taverna-multiplayer-dev
          path: preview/index.html
      - name: Validar código original da Taverna
        run: node qa/validar.js
  candidata-publicacao:
    name: Preparar atualização do app público
    needs: integridade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Montar e validar versão aprovada
        run: |
          node integracao/montar-v5-vitoria.mjs
          TAVERNA_RELEASE=../release-v5/index.html node qa/validar-release-v3.mjs
      - name: Criar branch de publicação somente com index.html
        run: |
          cp release-v5/index.html /tmp/taverna-v5-vitoria.html
          git fetch origin main
          git checkout -B multiplayer-v5-vitoria origin/main
          cp /tmp/taverna-v5-vitoria.html site/index.html
          git config user.name "Taverna Release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html
          git commit -m "Mostrar anúncio de vitória aos convidados por 4 segundos"
          git push --force origin HEAD:refs/heads/multiplayer-v5-vitoria
